name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the release APK
        run: |
          chmod +x gradlew
          ./gradlew :lemuroid-app:assembleFreeDynamicRelease -PbuildNumber=$BUILD_NUMBER --stacktrace --no-daemon

      - name: Collect the APK
        run: |
          mkdir -p out
          apk=$(find lemuroid-app/build/outputs/apk -name "*release*.apk" | head -1)
          echo "Built $apk"
          cp "$apk" out/RommTV.apk
          # version.txt: the build number, so the app can tell when a newer one is out (in-app updates)
          printf "%s" "$BUILD_NUMBER" > out/version.txt
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: RommTV-build-${{ github.run_number }}
          path: out/RommTV.apk

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          for try in 1 2 3 4 5 6; do
            if gh release create latest out/RommTV.apk out/version.txt \
                --title "RomM TV build $BUILD_NUMBER" \
                --notes "Build $BUILD_NUMBER from ${GITHUB_SHA:0:7}. Download RommTV.apk below, or use Update in the app." \
                --latest; then
              exit 0
            fi
            sleep 10
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          done
          exit 1
